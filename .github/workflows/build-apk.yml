
name: Build MyOverlay APK v1.6

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract MyOverlay project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | sort | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found!"
            exit 1
          fi

          echo "Using project: $ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project

          PROJECT_DIR=$(find project -type f -name "settings.gradle*" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Verify app version
        run: |
          cd "$PROJECT_DIR"
          grep -q 'versionName = "1.6"' app/build.gradle.kts
          grep -q 'versionCode = 9' app/build.gradle.kts
          echo "Version verification passed."

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyOverlay-v1.6-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
